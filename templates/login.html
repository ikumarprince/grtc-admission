<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Sign In - Admission & Management System</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-container-wrapper {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-box-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      padding: 2rem;
    }
    @media (max-width: 768px) {
      .login-box-card {
        padding: 1.4rem;
        border-radius: 16px;
        box-shadow: var(--shadow-md);
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="header-logo-icon">🎓</div>
      <div class="header-title">
        <h1 class="inst-name-text">Gyanoday Rojgar Training Centre</h1>
        <p class="inst-tagline-text">Khaspur Ramchandra pahalwan path near bajaj showroom patna 801503</p>
      </div>
    </div>
    <div>
      <a href="/register" class="btn btn-outline-primary btn-sm" style="color: white; border-color: rgba(255,255,255,0.4); text-decoration: none;">
        📝 New Registration
      </a>
    </div>
  </header>

  <!-- Login Main -->
  <main class="login-container-wrapper">
    <div class="login-box-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2.8rem; margin-bottom: 4px;">🔐</div>
        <h2 style="font-size: 1.35rem; color: var(--primary-dark); font-weight: 800;">Sign In to Portal</h2>
        <p style="font-size: 0.84rem; color: var(--text-muted); margin-top: 4px;">Students, Center Managers & SuperAdmin</p>
      </div>

      <form id="form_login" onsubmit="event.preventDefault(); handleLogin(); return false;">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="login_id">Mobile Number / Email / User ID <span class="req">*</span></label>
          <input type="text" class="form-control" id="login_id" placeholder="Enter Mobile Number / Email ID" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.2rem;">
          <label for="login_password">Password <span class="req">*</span></label>
          <input type="password" class="form-control" id="login_password" placeholder="Enter your password" required>
        </div>

        <button type="button" onclick="handleLogin()" class="btn btn-primary" style="width: 100%; font-size: 1rem; font-weight: 700;">
          🔓 Login to Portal
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.2rem;">
        <p style="font-size: 0.86rem; color: var(--text-muted); margin-bottom: 8px;">
          Naya student account banana hai?
        </p>
        <a href="/register" class="btn btn-outline-primary" style="width: 100%; text-decoration: none;">
          📝 Register as New Student
        </a>
      </div>


    </div>
  </main>

  <script src="/static/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const idInput = document.getElementById("login_id");
      const passInput = document.getElementById("login_password");
      
      [idInput, passInput].forEach(inp => {
        if (inp) {
          inp.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              handleLogin();
            }
          });
        }
      });
    });

    async function handleLogin() {
      const login_id = document.getElementById("login_id")?.value?.trim();
      const password = document.getElementById("login_password")?.value?.trim();
      const btn = document.querySelector(".login-box-card button");

      if (!login_id || !password) {
        alert("⚠️ Kripya Mobile / Email / User ID aur Password enter karein.");
        return;
      }

      if (btn) {
        btn.innerHTML = "⏳ Logging In...";
        btn.disabled = true;
      }

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login_id, password })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("agy_auth_token", data.token);
          window.location.href = "/dashboard";
        } else {
          alert("❌ Login Failed: " + (data.detail || "Invalid credentials"));
          if (btn) {
            btn.innerHTML = "🔓 Login to Portal";
            btn.disabled = false;
          }
        }
      } catch (err) {
        alert("❌ Connection error: " + err.message);
        if (btn) {
          btn.innerHTML = "🔓 Login to Portal";
          btn.disabled = false;
        }
      }
    }
  </script>
</body>
</html>
